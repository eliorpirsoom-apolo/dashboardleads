name: Scrape Lead Manager

# Runs the Playwright scraper outside of Vercel (which can't run a browser),
# pulling leads from Lead Manager and writing them to the Turso database that
# the Vercel dashboard reads from.

on:
  # Manual trigger (Actions tab → Run workflow). Great for the first test.
  workflow_dispatch:
  # Scheduled run. Default: every hour. Adjust the cron as needed.
  schedule:
    - cron: "0 * * * *"

# Avoid overlapping runs writing to the DB at the same time.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma CLI placeholder (runtime uses Turso below).
      DATABASE_URL: "file:./dev.db"
      # --- Turso (where data is written) ---
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # --- Lead Manager credentials / URLs ---
      LEAD_MANAGER_BASE_URL: ${{ secrets.LEAD_MANAGER_BASE_URL }}
      LEAD_MANAGER_LOGIN_URL: ${{ secrets.LEAD_MANAGER_LOGIN_URL }}
      LEAD_MANAGER_LEADS_URL: ${{ secrets.LEAD_MANAGER_LEADS_URL }}
      LEAD_MANAGER_USERNAME: ${{ secrets.LEAD_MANAGER_USERNAME }}
      LEAD_MANAGER_PASSWORD: ${{ secrets.LEAD_MANAGER_PASSWORD }}
      HEADLESS: "true"
      # --- Optional selector/column overrides (set as repo Variables) ---
      SELECTOR_USERNAME: ${{ vars.SELECTOR_USERNAME }}
      SELECTOR_PASSWORD: ${{ vars.SELECTOR_PASSWORD }}
      SELECTOR_LOGIN_BUTTON: ${{ vars.SELECTOR_LOGIN_BUTTON }}
      SELECTOR_LOGIN_SUCCESS: ${{ vars.SELECTOR_LOGIN_SUCCESS }}
      SELECTOR_LEADS_TABLE: ${{ vars.SELECTOR_LEADS_TABLE }}
      COL_LEAD_ID: ${{ vars.COL_LEAD_ID }}
      COL_CAMPAIGN: ${{ vars.COL_CAMPAIGN }}
      COL_DATETIME: ${{ vars.COL_DATETIME }}
      COL_STATUS: ${{ vars.COL_STATUS }}
      COL_SOURCE: ${{ vars.COL_SOURCE }}
      # --- Optional alerting ---
      ALERT_DROP_THRESHOLD_PERCENT: ${{ vars.ALERT_DROP_THRESHOLD_PERCENT }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
      ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run scraper sync
        run: npm run scrape

      # On failure, capture a screenshot/trace artifact if the scraper saved one.
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            storage/
            *.png
          if-no-files-found: ignore
